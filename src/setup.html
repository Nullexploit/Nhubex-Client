<!doctype html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configurar Nhubex</title><link rel="stylesheet" href="setup.css"></head>
<body>
  <main class="card">
    <div class="brand"><span class="mark">N</span><span>NHUBEX</span></div>
    <h1>Conecta tu sistema POS</h1>
    <p>Selecciona el ambiente en el que deseas ejecutar Nhubex. Para cambiarlo, elimina los datos de caché de Nhubex.</p>
    <form id="setup-form">
      <label for="environment">Ambiente</label>
      <select id="environment" autofocus required>
        <option value="" selected disabled>Selecciona un ambiente</option>
        <option value="alpha">Alpha</option>
        <option value="beta">Beta</option>
        <option value="production">Producción</option>
      </select>
      <p id="error" class="error" role="alert"></p>
      <button type="submit">Abrir Nhubex</button>
    </form>
  </main>
  <script src="setup.js"></script>
</body>
</html>
