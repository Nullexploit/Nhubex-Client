<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ajustes de impresión — Nhubex</title>
  <link rel="stylesheet" href="print-settings.css">
</head>
<body>
  <main>
    <header>
      <div class="mark">N</div>
      <div><h1>Ajustes de impresión</h1><p>Configura aquí las opciones que usará la impresión silenciosa.</p></div>
    </header>
    <form id="settings-form">
      <label>Impresora
        <select id="printerName"><option value="">Predeterminada del sistema</option></select>
      </label>
      <div class="row">
        <label>Tamaño de papel
          <select id="paperSize">
            <option value="Letter">Carta (Letter)</option><option value="A4">A4</option>
            <option value="A5">A5</option><option value="Legal">Legal</option><option value="Tabloid">Tabloid</option>
            <optgroup label="Rollos para mini printer">
              <option value="ticket-58">Ticket 58 mm · largo automático (2″)</option>
              <option value="ticket-76">Ticket 76.2 mm · largo automático (3″)</option>
              <option value="ticket-80">Ticket 80 mm · largo automático</option>
              <option value="ticket-88">Ticket 88 mm · largo automático</option>
            </optgroup>
          </select>
        </label>
        <label>Orientación
          <select id="orientation"><option value="portrait">Vertical</option><option value="landscape">Horizontal</option></select>
        </label>
      </div>
      <div class="row">
        <label>Escala (%)<input id="scale" type="number" min="10" max="200" step="1"></label>
        <label>Márgenes
          <select id="marginType">
            <option value="default">Predeterminados</option><option value="none">Ninguno</option>
            <option value="printableArea">Área imprimible</option><option value="custom">Personalizados (mm)</option>
          </select>
        </label>
      </div>
      <fieldset id="custom-margins">
        <legend>Márgenes personalizados (mm)</legend>
        <div class="row four">
          <label>Arriba<input id="marginTop" type="number" min="0" max="100" step="0.5"></label>
          <label>Abajo<input id="marginBottom" type="number" min="0" max="100" step="0.5"></label>
          <label>Izquierda<input id="marginLeft" type="number" min="0" max="100" step="0.5"></label>
          <label>Derecha<input id="marginRight" type="number" min="0" max="100" step="0.5"></label>
        </div>
      </fieldset>
      <label class="check"><input id="printBackground" type="checkbox"> Imprimir gráficos y fondos</label>
      <label class="check"><input id="color" type="checkbox"> Imprimir en color</label>
      <p id="status" role="status"></p>
      <footer><button type="button" class="secondary" id="cancel">Cancelar</button><button type="submit">Guardar configuración</button></footer>
    </form>
  </main>
  <script src="print-settings.js"></script>
</body>
</html>
